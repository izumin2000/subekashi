{% if history.editor.is_open or history.editor.is_forced_open or history.editor.ip == ip %}
    <p>編集者: <a href="{% url 'subekashi:editor' history.editor.id %}">
        {{ history.editor }}
        {% if history.editor.ip == ip %}(あなた){% endif %}
    </a></p>
{% else %}
    <p>編集者: 非公開 <a href="{% url 'subekashi:history_report' history.id %}?next={{ request.get_full_path|urlencode }}" id="history-report-{{ history.id }}" class="history-report" rel="nofollow"><i class="fas fa-flag"></i>報告</a></p>
{% endif %}
