<form method="get" id="stats-filter">
    {% if show_all_songrange %}
        <div class="range-radio-group">
            <input type="radio" id="songrange-all" name="songrange" value="all" {% if songrange == 'all' %}checked{% endif %} onchange="this.form.submit()">
            <label for="songrange-all">全て</label>
            <input type="radio" id="songrange-subeana" name="songrange" value="subeana" {% if songrange == 'subeana' %}checked{% endif %} onchange="this.form.submit()">
            <label for="songrange-subeana">すべあな界隈曲のみ</label>
            <input type="radio" id="songrange-xx" name="songrange" value="xx" {% if songrange == 'xx' %}checked{% endif %} onchange="this.form.submit()">
            <label for="songrange-xx">すべあな界隈曲以外</label>
        </div>
    {% endif %}
    <div class="stats-select-group">
        <select name="year" id="stats-year" onchange="this.form.submit()">
            <option value="all" {% if year == 'all' %}selected{% endif %}>全ての年</option>
            {% for y in year_choices %}
                <option value="{{ y }}" {% if year == y|stringformat:"s" %}selected{% endif %}>{{ y }}年</option>
            {% endfor %}
        </select>
        <select name="month" id="stats-month" onchange="this.form.submit()">
            <option value="all" {% if month == 'all' %}selected{% endif %}>全ての月</option>
            {% for m in month_choices %}
                <option value="{{ m }}" {% if month == m|stringformat:"s" %}selected{% endif %}>{{ m }}月</option>
            {% endfor %}
        </select>
    </div>
</form>
