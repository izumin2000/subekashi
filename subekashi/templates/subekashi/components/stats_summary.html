{% load humanize %}
<div class="stats-list">
    {% for item in stats_items %}
        {% if item.value is not None %}
            <div class="stat-item">
                <i class="{{ item.icon }}"></i>
                <p class="icon-p">{{ item.label }}</p>
                <p class="stat-value">{{ item.value|intcomma:False }}</p>
            </div>
        {% endif %}
    {% endfor %}
    {% if kenreki %}
        <div class="stat-item">
            <i class="fas fa-trophy"></i>
            <p class="icon-p">鍵歴</p>
            <p class="stat-value"{% if kenreki.overflow_color %} style="color: {{ kenreki.overflow_color }};"{% endif %}>{{ kenreki.points|intcomma:False }}</p>
        </div>
    {% endif %}
</div>
