<p class="lyric" data-ai-id="{{ item.id }}">
    {% for token in item.tokens %}
        {% if token.is_replaceable %}
            <span class="word-token" role="button" tabindex="0"
                  data-ai-id="{{ item.id }}"
                  data-token-index="{{ token.index }}"
                  data-word="{{ token.surface }}"
                  data-hinshi="{{ token.hinshi }}"
                  data-persist="{{ persist|yesno:'true,false' }}">{{ token.surface }}</span>
        {% else %}
            <span class="word-token-fixed">{{ token.surface }}</span>
        {% endif %}
    {% endfor %}
</p>
