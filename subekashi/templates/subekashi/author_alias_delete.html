{% extends "subekashi/base/base.html" %}


{% load static %}
{% block css %}{% static 'subekashi/css/author_aliases.css'%}{% endblock %}

{% block content %}
<section>
    <h1>{{ author.name }}の別名『{{ alias.name }}』を削除</h1>
    <p>この別名を削除します。よろしいですか？</p>
    <div class="action-buttons">
        <a href="{% url 'subekashi:author_aliases' author.id %}" class="action-button black-action-button"><i class="fas fa-times"></i><span class="icon-p-big">キャンセル</span></a>
        <form action="{% url 'subekashi:author_alias_delete' author.id alias.id %}" method="POST" class="action-button-form">{% csrf_token %}
            <button type="submit" class="action-button black-action-button"><i class="far fa-trash-alt"></i><span class="icon-p-big">削除する</span></button>
        </form>
    </div>
</section>
{% endblock %}
