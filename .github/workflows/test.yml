name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create local_settings.py
        run: |
          cat > config/local_settings.py << 'EOF'
          SECRET_KEY = "ci-test-secret-key"
          NEW_DISCORD_URL = ""
          CONTACT_DISCORD_URL = ""
          ERROR_DISCORD_URL = ""
          DSP_DISCORD_URL = ""
          PYTHONANYWHERE_USERNAME = ""
          PYTHONANYWHERE_TOKEN = ""
          VENV_PATH = ""
          YOUTUBE_API_KEY = ""
          GOOGLE_SHEETS_SPREADSHEET_ID = ""
          GOOGLE_SHEETS_API_KEY = ""
          DEBUG = True
          SEND_DISCORD = False
          USE_MYSQL = False
          MYSQL_PASSWORD = ""
          GOOGLE_DRIVE_CLIENT_ID = ""
          GOOGLE_DRIVE_CLIENT_SECRET = ""
          GOOGLE_DRIVE_REFRESH_TOKEN = ""
          GOOGLE_DRIVE_FOLDER_ID = ""
          EOF

      - name: Create dynamic constants
        run: |
          cat > subekashi/constants/dynamic/maintenance.json << 'EOF'
          {"IS_MAINTENANCE": false, "MAINTENANCE_MESSAGE": "<p>メンテナンス中です</p>"}
          EOF
          echo 'REJECT_LIST = []' > subekashi/constants/dynamic/reject.py
          echo '{"VERSION": "dev"}' > subekashi/constants/dynamic/version.json
          echo '[]' > subekashi/constants/dynamic/word.json

      - name: Run tests
        run: python manage.py test subekashi.tests article.tests --verbosity=2

  # mcp/ はルートの requirements.txt に依存を入れないため、専用のジョブで依存を入れて実行する
  mcp-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mcp/requirements.txt

      - name: Install dependencies
        run: pip install -r mcp/requirements.txt

      - name: Run tests
        working-directory: mcp
        run: python -m unittest discover -s tests --verbose
